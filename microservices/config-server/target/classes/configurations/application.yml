eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

spring:
  cloud:
    config:
      override-system-properties: false

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - info
  endpoint:
    health:
      show-details: always

services:
  user-management-service:
    bank-user-url: http://localhost:8090/bank-user
  account-management-service:
    account-url: http://localhost:8091/account
  payment-processing-service:
    payment-url: http://localhost:8092/payment
  money-transfer-service:
    transaction-url: http://localhost:8093/transaction

kafka:
  bootstrap-servers: localhost:9092
  topic:
    email: email-topic
    report: report-topic